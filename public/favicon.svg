<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="50%" stop-color="#FF4D17"/>
      <stop offset="100%" stop-color="#E03200"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="50%" stop-color="#FF4D17"/>
      <stop offset="100%" stop-color="#B32400"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#FF4D17" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square / Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bg)" stroke="url(#rimGrad)" stroke-width="12"/>
  
  <!-- Inner Accent Line -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.08"/>

  <!-- Bold Geometric 'S' Monogram -->
  <g filter="url(#glow)">
    <path d="M 345 145 L 205 145 L 150 200 L 150 250 L 300 250 L 350 300 L 350 365 L 165 365 L 165 325 L 305 325 L 305 290 L 155 290 L 110 245 L 110 180 L 295 180 L 345 145 Z" fill="url(#orangeGrad)"/>
    <path d="M 345 145 L 205 145 L 175 175 L 315 175 Z" fill="#FFE5D6" opacity="0.6"/>
  </g>
</svg>
